<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bingo multijugador</title>
<style>
:root{--bg:#f3f1ec;--panel:#fff;--ink:#1b2430;--muted:#6b7480;--line:#d9d5cb;--hit:#1d5bff;--drawn:#e7e4db;--pick:#ffb703;--win:#14a44d}
@media (prefers-color-scheme:dark){:root{--bg:#111821;--panel:#1a2430;--ink:#eef1f5;--muted:#98a2b0;--line:#2c3947;--hit:#4d86ff;--drawn:#243140;--win:#34c76f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;padding:20px 16px 40px}
main{max-width:680px;margin:0 auto}
h1{margin:0 0 4px;font-size:2rem}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ball{width:76px;height:76px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:2rem;font-weight:800;flex:none}
.ball.hit{background:var(--hit);color:#fff}
.grow{flex:1;min-width:160px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 16px;background:var(--ink);color:var(--bg);cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
button:disabled{opacity:.4;cursor:not-allowed}
input{font:inherit;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-width:200px}
button:focus-visible,input:focus-visible,.cell:focus-visible{outline:3px solid var(--hit);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.cell{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;background:var(--panel);border:1px solid var(--line);color:var(--ink);font:inherit;font-weight:700;font-size:clamp(.7rem,2.8vw,1rem);padding:0;cursor:pointer}
.cell.pick{border:3px solid var(--pick)}
.cell.drawn{background:var(--drawn);color:var(--muted)}
.cell.hit{background:var(--hit);border-color:var(--hit);color:#fff}
.cell.last{transform:scale(1.12)}
.cell:disabled{cursor:default;opacity:1}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
li:last-child{border:0}
li.me{font-weight:700}
.win{background:var(--win);color:#fff;border-radius:14px;padding:14px 16px;margin-bottom:14px;font-weight:700;font-size:1.1rem}
.err{color:#d6336c;min-height:1.2em;margin:6px 0 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Bingo</h1>
  <p class="sub" id="sub"></p>
  <div class="card" id="conn" hidden>Sin conexión con el servidor. Reintentando…</div>

  <section class="card" id="join">
    <div class="row">
      <input id="name" maxlength="20" placeholder="Tu nombre" autocomplete="off">
      <button id="enter">Entrar a la sala</button>
    </div>
  </section>

  <section id="game" hidden>
    <div class="win" id="win" hidden role="status"></div>
    <div class="card row">
      <div class="ball" id="ball">–</div>
      <div class="grow"><strong id="status"></strong><div id="count" style="color:var(--muted)"></div></div>
      <div class="row">
        <button id="ready">Listo</button>
        <button id="unready" class="alt">Cambiar números</button>
        <button id="start">Empezar</button>
        <button id="again">Jugar otra vez</button>
      </div>
    </div>
    <p class="err" id="msg" role="alert"></p>
    <div class="grid" id="grid"></div>
    <div class="card" style="margin-top:14px"><ul id="players"></ul></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const PICKS = 5;
let ws, myName = '', S = null, picks = [], prevPhase = 'lobby';

const cells = [];
for (let i = 1; i <= 100; i++) {
  const b = document.createElement('button');
  b.className = 'cell'; b.textContent = i; b.setAttribute('aria-label', 'Número ' + i);
  b.onclick = () => toggle(i);
  $('grid').appendChild(b); cells[i] = b;
}

function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = () => { $('conn').hidden = true; if (myName) send({ type: 'join', name: myName }); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'state') { S = m; render(); }
    else if (m.type === 'error') $('msg').textContent = m.message;
  };
  ws.onclose = () => { $('conn').hidden = false; setTimeout(connect, 2000); };
}

function me() { return S && S.players.find((p) => p.id === S.you); }

function toggle(n) {
  const m = me();
  if (!S || S.phase !== 'lobby' || !m || m.ready) return;
  const k = picks.indexOf(n);
  if (k > -1) picks.splice(k, 1); else if (picks.length < PICKS) picks.push(n);
  $('msg').textContent = '';
  render();
}

function render() {
  const m = me(); if (!m) return;
  if (S.phase === 'lobby' && prevPhase !== 'lobby' && !m.ready) picks = [];
  prevPhase = S.phase;
  $('join').hidden = true; $('game').hidden = false;

  for (let i = 1; i <= 100; i++) {
    const isPick = picks.indexOf(i) > -1, isDrawn = S.drawn.includes(i);
    cells[i].className = 'cell' + (isPick ? ' pick' : '') +
      (isDrawn ? (isPick ? ' hit' : ' drawn') : '') + (i === S.last ? ' last' : '');
    cells[i].disabled = !(S.phase === 'lobby' && !m.ready);
  }
  $('ball').textContent = S.last == null ? '–' : S.last;
  $('ball').className = 'ball' + (S.last != null && picks.includes(S.last) && m.inRound ? ' hit' : '');

  const myHits = picks.filter((n) => S.drawn.includes(n)).length;
  const allReady = S.players.every((p) => p.ready);
  if (S.phase === 'lobby') {
    $('sub').textContent = 'Elegí 5 números del 1 al 100 y tocá "Listo".';
    $('status').textContent = m.ready ? 'Listo, esperando a los demás' : 'Elegí tus números';
    $('count').textContent = m.ready ? 'Jugadores listos: ' + S.players.filter((p) => p.ready).length + ' de ' + S.players.length
                                     : picks.length + ' de ' + PICKS + ' elegidos';
  } else {
    $('sub').textContent = 'Tus números tienen borde amarillo; cuando salen se pintan de azul.';
    $('status').textContent = S.phase === 'ended' ? 'Terminó la partida'
      : (S.last == null ? 'Va a salir el primer número…' : 'Salió el ' + S.last);
    $('count').textContent = m.inRound ? myHits + ' de ' + PICKS + ' marcados · salieron ' + S.drawn.length
                                       : 'Estás mirando esta partida · salieron ' + S.drawn.length;
  }
  $('ready').hidden = !(S.phase === 'lobby' && !m.ready);
  $('ready').disabled = picks.length !== PICKS;
  $('unready').hidden = !(S.phase === 'lobby' && m.ready);
  $('start').hidden = S.phase !== 'lobby';
  $('start').disabled = !(allReady && S.players.length >= S.min);
  $('again').hidden = S.phase !== 'ended';

  const w = $('win');
  w.hidden = S.phase !== 'ended';
  if (S.phase === 'ended') {
    const iWon = S.winners.includes(m.name) && m.inRound && myHits === PICKS;
    w.textContent = (iWon ? '¡Ganaste! ' : '') + (S.winners.length > 1 ? 'Empate: ' : 'Ganó ') + S.winners.join(' y ') + ' en ' + S.drawn.length + ' sorteos.';
  }

  const ul = $('players'); ul.innerHTML = '';
  S.players.forEach((p) => {
    const li = document.createElement('li'); if (p.id === S.you) li.className = 'me';
    const a = document.createElement('span'); a.textContent = p.name + (p.id === S.you ? ' (vos)' : '');
    const b = document.createElement('span');
    b.textContent = S.phase === 'lobby' ? (p.ready ? 'listo' : 'eligiendo')
      : (p.inRound ? p.hits + '/' + PICKS : 'mirando');
    li.append(a, b); ul.appendChild(li);
  });
}

$('enter').onclick = () => {
  myName = $('name').value.trim() || 'Jugador';
  send({ type: 'join', name: myName });
};
$('name').onkeydown = (e) => { if (e.key === 'Enter') $('enter').click(); };
$('ready').onclick = () => send({ type: 'ready', picks });
$('unready').onclick = () => { picks = []; send({ type: 'unready' }); };
$('start').onclick = () => send({ type: 'start' });
$('again').onclick = () => send({ type: 'again' });
connect();
</script>
</body>
</html>
